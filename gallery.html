<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Галерия | Юнайтед Благоевград</title>
    <meta
      name="description"
      content="Снимки от отбора и тренировките на Юнайтед Благоевград."
    />
    <link rel="icon" href="images/logo.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Към началото">
        <img src="images/logo.jpg" alt="Лого на Юнайтед Благоевград" />
        <span>
          <strong>United</strong>
          <small>Blagoevgrad FC</small>
        </span>
      </a>

      <nav aria-label="Основна навигация">
        <a href="index.html#otbor">Отборът</a>
        <a href="index.html#cennosti">Ценности</a>
        <a class="active" href="gallery.html" aria-current="page">Галерия</a>
      </nav>
    </header>

    <main class="gallery-page">
      <section class="gallery-hero">
        <p class="section-number light">United Blagoevgrad / Галерия</p>
        <h1>Нашият <span>ритъм.</span></h1>
        <p>
          От тренировката до отбора — моменти, които показват характера зад цветовете.
        </p>
      </section>

      <section class="gallery-wall" aria-label="Снимки на отбора">
        <figure class="gallery-item gallery-item-feature">
          <img src="images/team2.jpg" alt="Играчите на Юнайтед Благоевград" />
          <figcaption>
            <span>01</span>
            <strong>Отборът</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait-half">
          <img src="images/match-01.jpg" alt="Играч на Юнайтед Благоевград с топка" />
          <figcaption>
            <span>02</span>
            <strong>На терена</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait-half">
          <img src="images/team1.jpg" alt="Загрявка на играчите" loading="lazy" />
          <figcaption>
            <span>03</span>
            <strong>Отборен дух</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-landscape">
          <img src="images/training-01.jpg" alt="Вечерна тренировка на отбора" loading="lazy" />
          <figcaption>
            <span>04</span>
            <strong>Вечерна тренировка</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-02.jpg" alt="Упражнение с топка по време на тренировка" loading="lazy" />
          <figcaption>
            <span>05</span>
            <strong>Техника</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-03.jpg" alt="Играч изпълнява упражнение с топка" loading="lazy" />
          <figcaption>
            <span>06</span>
            <strong>Точност</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-04.jpg" alt="Отборът по време на тренировка" loading="lazy" />
          <figcaption>
            <span>07</span>
            <strong>Интензивност</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-05.jpg" alt="Играчите тренират под осветлението" loading="lazy" />
          <figcaption>
            <span>08</span>
            <strong>Заедно</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-06.jpg" alt="Тренировъчно занимание на футболния терен" loading="lazy" />
          <figcaption>
            <span>09</span>
            <strong>Движение</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/training-07.jpg" alt="Играч и футболна топка на вечерна тренировка" loading="lazy" />
          <figcaption>
            <span>10</span>
            <strong>Фокус</strong>
          </figcaption>
        </figure>

        <figure class="gallery-item gallery-item-portrait">
          <img src="images/match-02.jpg" alt="Играчите на дневна тренировка" loading="lazy" />
          <figcaption>
            <span>11</span>
            <strong>Всеки ден напред</strong>
          </figcaption>
        </figure>
      </section>

      <section class="gallery-back">
        <p>Синьо. Червено. Заедно.</p>
        <a class="button light-button" href="index.html">← Към началото</a>
      </section>
    </main>

    <footer>
      <strong>United Blagoevgrad</strong>
      <span>Football Club · Blagoevgrad</span>
      <span>Синьо. Червено. Заедно.</span>
    </footer>
  </body>
</html>
